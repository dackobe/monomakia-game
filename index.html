<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MONOMAKIA - モノマキア</title>
  <style>
    :root {
      --bg-color: #0d0d16;
      --card-bg: #16213e;
      --accent-color: #1a1a2e;
      --text-main: #e94560;
      --glow-color: rgba(233, 69, 96, 0.8);
      --text-sub: #ffffff;
      --hp-green: #00ff88;
      --hp-red: #ff4b2b;
      --status-online: #00ff88;
      --status-offline: #ff4444;
    }

    /* --- ダメージ演出用スタイル --- */
    body.dmg-flash::after {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 0, 0, 0.3); z-index: 9999; pointer-events: none;
      animation: flash-anim 0.3s ease-out forwards;
    }
    @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

    .shake { animation: shake-anim 0.3s cubic-bezier(.36,.07,.19,.97) both; transform: translate3d(0, 0, 0); }
    @keyframes shake-anim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    body { font-family: 'Hiragino Mincho ProN', 'Georgia', serif; text-align: center; margin: 0; background: var(--bg-color); color: var(--text-sub); overflow-x: hidden; }
    .screen { display: none; padding: 15px; min-height: 100vh; box-sizing: border-box; }
    .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .logo-box { width: 95%; max-width: 450px; margin-bottom: 2px; display: flex; justify-content: center; }
    .game-logo-svg { width: 100%; height: auto; filter: drop-shadow(0 0 5px var(--glow-color)) drop-shadow(0 0 15px var(--glow-color)); }
    .game-logo-text { font-family: 'Times New Roman', serif; font-weight: bold; fill: var(--text-main); text-anchor: middle; letter-spacing: 6px; }
    .connection-panel { background: rgba(255, 255, 255, 0.03); padding: 8px 15px; border-radius: 20px; margin-bottom: 25px; display: flex; align-items: center; gap: 8px; font-size: 0.7em; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-connecting { background: #ffcc00; animation: blink 1s infinite; }
    .dot-online { background: var(--status-online); box-shadow: 0 0 10px var(--status-online); }
    .dot-offline { background: var(--status-offline); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    input { padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #333; width: 80%; max-width: 260px; margin-bottom: 15px; background: #000; color: white; text-align: center; }
    button { padding: 12px 24px; cursor: pointer; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: var(--accent-color); color: white; font-weight: bold; transition: 0.3s; }
    .primary-btn { background: var(--text-main); border: none; width: 220px; font-size: 1.1em; }
    .exit-link-btn { background: none; border: none; color: #666; font-size: 0.8em; margin-top: 25px; text-decoration: underline; }
    .battle-field { width: 100%; max-width: 500px; }
    .hp-section { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .player-row { display: flex; align-items: center; justify-content: space-between; }
    .name-label { font-size: 0.85em; color: var(--text-main); width: 100px; text-align: left; overflow: hidden; white-space: nowrap; }
    .hp-bar-outer { flex-grow: 1; height: 8px; background: #111; margin: 0 10px; overflow: hidden; border-radius: 4px; }
    .hp-bar-inner { height: 100%; background: var(--hp-green); width: 100%; transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .card-btn { height: 95px; background: #0a0a0f; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; -webkit-tap-highlight-color: transparent; }
    #log { width: 100%; height: 160px; overflow-y: auto; margin-top: 20px; font-size: 0.85em; background: rgba(0,0,0,0.6); padding: 10px; text-align: left; border-left: 3px solid var(--text-main); box-sizing: border-box; color: #ccc; line-height: 1.5; }
    .log-entry { margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    .log-hands { font-size: 1.2em; letter-spacing: 2px; display: block; }
    .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
  </style>
</head>
<body>

  <div id="screen-name" class="screen active">
    <div class="logo-box">
      <svg class="game-logo-svg" viewBox="0 0 380 70">
        <text x="50%" y="50" class="game-logo-text" font-size="48">MONOMAKIA</text>
      </svg>
    </div>
    <p style="font-size: 1em; letter-spacing: 5px; margin-bottom: 15px; color: var(--text-main); opacity: 0.7;">一対一の決闘</p>
    <div class="connection-panel"><div id="status-dot" class="status-dot dot-connecting"></div><span id="status-text">CONNECTING...</span></div>
    <input type="text" id="user-name" placeholder="戦士の名を入力せよ" maxlength="10">
    <button id="start-button" class="primary-btn" onclick="initAudioAndLobby()" disabled>門をくぐる</button>
  </div>

  <div id="screen-lobby" class="screen">
    <h2 style="color: var(--text-main); letter-spacing: 2px;">決闘の場を選択</h2>
    <div class="room-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px;">
      <button class="card-btn" onclick="joinRoom(1)">第壱の間</button>
      <button class="card-btn" onclick="joinRoom(2)">第弐の間</button>
      <button class="card-btn" onclick="joinRoom(3)">第参の間</button>
      <button class="card-btn" onclick="joinRoom(4)">第四の間</button>
    </div>
    <button class="exit-link-btn" onclick="showScreen('screen-name')">名を改める</button>
  </div>

  <div id="screen-wait" class="screen">
    <h2 id="room-display" style="color:var(--text-main); letter-spacing: 2px;">ROOM</h2>
    <button id="ready-btn" class="primary-btn" onclick="sendReady()">準備完了</button>
    <p id="wait-info" style="margin-top:20px; color:var(--status-online); font-size: 0.8em;"></p>
    <button class="exit-link-btn" onclick="leaveRoom()">戦場を去る</button>
  </div>

  <div id="screen-game" class="screen">
    <div id="battle-wrap" class="battle-field">
      <div class="hp-section">
        <div class="player-row">
          <span class="name-label" id="p1-name">あなた</span>
          <div class="hp-bar-outer"><div id="p1-hp-fill" class="hp-bar-inner"></div></div>
          <span id="p1-hp-text" style="width:20px;">5</span>
        </div>
        <div class="player-row">
          <span class="name-label" id="p2-name">相手</span>
          <div class="hp-bar-outer"><div id="p2-hp-fill" class="hp-bar-inner"></div></div>
          <span id="p2-hp-text" style="width:20px;">5</span>
        </div>
      </div>
      <div id="player-ui">
        <p id="game-info" style="font-size: 0.85em; margin-bottom: 15px; color: #888;">策を投じよ</p>
        <div class="card-grid">
          <button class="card-btn" onclick="sendCard('smash')"><b>💥 スマッシュ</b></button>
          <button class="card-btn" onclick="sendCard('guard')"><b>🛡️ 防御</b></button>
          <button class="card-btn" onclick="sendCard('attack')"><b>⚔️ 攻撃</b></button>
          <button class="card-btn" onclick="sendCard('feint')"><b>🃏 フェイント</b></button>
        </div>
      </div>
      <div id="spec-ui" style="display:none; padding: 20px 0; color:var(--text-main); font-weight:bold;">📺 観戦中</div>
      <div id="log"></div>
      <button class="exit-link-btn" onclick="confirmLeave()">降参する</button>
    </div>
  </div>

  <div id="finish-screen" class="overlay">
    <h1 id="winner-text" style="color:var(--text-main); font-size: 2.2em; letter-spacing: 5px;">勝利</h1>
    <button class="primary-btn" onclick="leaveRoom()">ロビーへ戻る</button>
  </div>

  <script>
    let ws;
    let myName = "";
    let isSpectator = false;
    let currentHP1 = 5, currentHP2 = 5;

    // --- Web Audio API 合成音生成 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'select') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(); osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(); osc.stop(now + 0.3);
      } else if (type === 'draw') {
        osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(); osc.stop(now + 0.05);
      } else if (type === 'finish') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 1);
        osc.start(); osc.stop(now + 1);
      }
    }

    function initAudioAndLobby() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playSound('select');
      showScreen('screen-lobby');
    }

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);
      const dot = document.getElementById('status-dot');
      const startBtn = document.getElementById('start-button');

      ws.onopen = () => { dot.className = "status-dot dot-online"; startBtn.disabled = false; };
      ws.onclose = () => { dot.className = "status-dot dot-offline"; startBtn.disabled = true; setTimeout(connectWS, 3000); };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const log = document.getElementById('log');

        if (data.type === "joined") {
          isSpectator = (data.role === "spectator");
          document.getElementById('room-display').innerText = data.room;
          showScreen('screen-wait');
        }

        if (data.type === "start") {
          showScreen('screen-game');
          document.getElementById('p1-name').innerText = data.p1_name;
          document.getElementById('p2-name').innerText = data.p2_name;
          document.getElementById('player-ui').style.display = isSpectator ? "none" : "block";
          document.getElementById('spec-ui').style.display = isSpectator ? "block" : "none";
          currentHP1 = data.p1_hp; currentHP2 = data.p2_hp;
          updateHP(currentHP1, currentHP2);
          log.innerHTML = `<div style="color:var(--hp-green);">--- 決闘開始 ---</div>`;
        }

        if (data.type === "result") {
          if (data.p1_hp < currentHP1 || data.p2_hp < currentHP2) {
            triggerDamageEffect(); playSound('hit');
          } else { playSound('draw'); }
          currentHP1 = data.p1_hp; currentHP2 = data.p2_hp;
          updateHP(currentHP1, currentHP2);
          
          const iconMap = { smash: "💥", guard: "🛡️", attack: "⚔️", feint: "🃏" };
          const winMap = { smash: "guard", guard: "attack", attack: "feint", feint: "smash" };
          const hands = `<span class="log-hands">${iconMap[data.p1_card]} ⟷ ${iconMap[data.p2_card]}</span>`;
          let logContent = "";

          if (winMap[data.p1_card] === data.p2_card) {
            logContent = `${hands}<div style="color:var(--hp-green);">🔥 【${data.p1_name}】の有効打！</div>`;
          } else if (winMap[data.p2_card] === data.p1_card) {
            logContent = `${hands}<div style="color:var(--hp-red);">💀 【${data.p2_name}】の痛恨の一撃！</div>`;
          } else {
            logContent = `${hands}<div style="color:#777;">⚡ 火花が散る（引き分け）</div>`;
          }
          log.innerHTML = `<div class="log-entry">${logContent}</div>` + log.innerHTML;
          if(!isSpectator) document.getElementById('game-info').innerText = "次なる策を";
        }

        if (data.type === "finish") {
          playSound('finish');
          document.getElementById('winner-text').innerText = data.winner + " の勝利";
          document.getElementById('finish-screen').style.display = "flex";
        }

        if (data.type === "info") {
          log.innerHTML = `<div style="color:#666; font-size:0.8em; margin-bottom:5px;">[Info] ${data.message}</div>` + log.innerHTML;
        }
      };
    }

    function triggerDamageEffect() {
      document.body.classList.remove('dmg-flash'); void document.body.offsetWidth;
      document.body.classList.add('dmg-flash');
      const wrap = document.getElementById('battle-wrap');
      wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
    }

    function updateHP(p1, p2) {
      document.getElementById('p1-hp-fill').style.width = (p1 * 20) + "%";
      document.getElementById('p2-hp-fill').style.width = (p2 * 20) + "%";
      document.getElementById('p1-hp-text').innerText = p1;
      document.getElementById('p2-hp-text').innerText = p2;
    }

    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function joinRoom(n) { playSound('select'); myName = document.getElementById('user-name').value.trim() || "無名の戦士"; ws.send(JSON.stringify({ type: "join", room: "第" + n + "の間", userName: myName })); }
    function sendReady() { playSound('select'); ws.send(JSON.stringify({ type: "ready" })); document.getElementById('ready-btn').disabled = true; }
    function sendCard(c) { playSound('select'); ws.send(JSON.stringify({ type: "card", card: c })); document.getElementById('game-info').innerText = "相手を待っている..."; }
    function leaveRoom() { ws.send(JSON.stringify({ type: "leave" })); location.reload(); }
    function confirmLeave() { if(confirm("降参して退きますか？")) leaveRoom(); }

    connectWS();
  </script>
</body>
</html>
