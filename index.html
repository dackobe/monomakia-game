<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MONOMAKIA - 剣闘士の決闘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen-name" class="screen active">
    <div class="logo-box">
      <svg class="game-logo-svg" viewBox="0 0 380 70">
        <text x="50%" y="50" class="game-logo-text" font-size="48">MONOMAKIA</text>
      </svg>
    </div>
    <div class="connection-panel">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">CONNECTING...</span>
    </div>
    <input type="text" id="user-name" placeholder="剣闘士の名を入力" maxlength="10">
    <button id="start-button" class="primary-btn" onclick="initAudioAndLobby()" disabled>闘技場へ入る</button>
  </div>

  <div id="screen-lobby" class="screen">
    <h2 style="color: var(--text-main);">戦場を選択</h2>
    <div class="room-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <button class="card-btn" onclick="joinRoom(1)">第壱の場</button>
      <button class="card-btn" onclick="joinRoom(2)">第弐の場</button>
    </div>
  </div>

  <div id="screen-wait" class="screen">
    <h2 id="room-display">FIELD</h2>
    <button id="ready-btn" class="primary-btn" onclick="sendReady()">準備完了</button>
  </div>

  <div id="screen-game" class="screen">
    <div id="battle-wrap" class="battle-field">
      <div class="hp-section">
        <div class="player-row">
          <span id="p1-name" style="font-weight:bold; min-width:80px;">Player1</span>
          <div class="hp-bar-outer"><div id="p1-hp-fill" class="hp-bar-inner"></div></div>
          <span id="p1-hp-text">5</span>
        </div>
        <div class="player-row">
          <span id="p2-name" style="font-weight:bold; min-width:80px;">Player2</span>
          <div class="hp-bar-outer"><div id="p2-hp-fill" class="hp-bar-inner"></div></div>
          <span id="p2-hp-text">5</span>
        </div>
      </div>
      
      <div class="card-grid">
        <button id="btn-smash" class="card-btn" onclick="sendCard('smash')"><b>💥 強襲</b><span class="advantage-info">▶ 🛡️ 盾を崩す</span></button>
        <button id="btn-guard" class="card-btn" onclick="sendCard('guard')"><b>🛡️ 盾で守る</b><span class="advantage-info">▶ ⚔️ 剣を弾く</span></button>
        <button id="btn-attack" class="card-btn" onclick="sendCard('attack')"><b>⚔️ 剣で切る</b><span class="advantage-info">▶ 🃏 避けるを突く</span></button>
        <button id="btn-feint" class="card-btn" onclick="sendCard('feint')"><b>🃏 避ける</b><span class="advantage-info">▶ 💥 大振りを躱す</span></button>
        <button id="btn-special" class="card-btn special-btn" style="grid-column: span 2; height: 60px;" onclick="sendCard('special')">
          <b style="color: #a349a4;">🌀 奇行</b>
          <span class="advantage-info">??? 予測不能 ???</span>
        </button>
      </div>
      
      <div id="log"></div>
      
      <div id="restart-area" style="display:none; margin-top: 20px; justify-content: center; gap: 10px; display: flex;">
        <button class="primary-btn" onclick="location.reload()" style="width: auto; min-width: 120px; font-size: 0.9rem;">タイトルへ戻る</button>
        <button class="primary-btn" onclick="this.disabled=true; this.innerText='待機中...'; sendReady()" style="width: auto; min-width: 120px; font-size: 0.9rem; background-color: var(--hp-green); color: #000; border: none;">🔥 再戦</button>
      </div>
    </div>
  </div>

  <div id="finish-screen" class="overlay">
    <h1 id="winner-text">勝利</h1>
    <button id="finish-btn-main" class="primary-btn" onclick="this.disabled=true; this.innerText='待機中...'; sendReady()">🔥 もう一度戦う</button>
    <button class="card-btn" onclick="hideOverlay()" style="margin-top:15px; height:auto; width: 220px;">ログを確認する</button>
  </div>

  <script src="audio-manager.js"></script>
  <script src="special-actions.js"></script>
  <script src="client.js"></script>
</body>
</html>
